name: Stable Build

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: stable-release
  cancel-in-progress: false

permissions:
  contents: write

env:
  DOTNET_NOLOGO: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  RUST_BACKTRACE: "1"

jobs:
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-22.04
    outputs:
      app_name: ${{ steps.names.outputs.app_name }}
      app_display_name: ${{ steps.names.outputs.app_display_name }}
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      release_notes: ${{ steps.notes.outputs.release_notes }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read app metadata
        id: names
        shell: bash
        run: |
          set -euo pipefail
          app_name="$(sed -n 's:.*<AppName>\(.*\)</AppName>.*:\1:p' Directory.Build.props)"
          app_display_name="$(sed -n 's:.*<AppDisplayName>\(.*\)</AppDisplayName>.*:\1:p' Directory.Build.props)"
          test -n "${app_name}"
          printf 'app_name=%s\n' "${app_name}" >> "$GITHUB_OUTPUT"
          printf 'app_display_name=%s\n' "${app_display_name:-$app_name}" >> "$GITHUB_OUTPUT"

      - name: Extract version from tag
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag must follow vMAJOR.MINOR.PATCH format, got: ${GITHUB_REF_NAME}"
            exit 1
          fi
          printf 'version=%s\ntag=%s\n' "${version}" "${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "Stable version: ${version}"

      - name: Verify version matches Directory.Build.props
        shell: bash
        run: |
          set -euo pipefail
          props_version="$(sed -n 's:.*<AppVersion>\(.*\)</AppVersion>.*:\1:p' Directory.Build.props)"
          tag_version="${{ steps.ver.outputs.version }}"
          if [ "$props_version" != "$tag_version" ]; then
            echo "::error::Tag version (${tag_version}) does not match Directory.Build.props (${props_version})."
            echo "Update Directory.Build.props to match before pushing the tag."
            exit 1
          fi
          echo "Version verified: Directory.Build.props = ${props_version}, tag = ${tag_version}"

      - name: Export release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "app_name=${{ steps.names.outputs.app_name }}"
            echo "app_display_name=${{ steps.names.outputs.app_display_name }}"
            echo "version=${{ steps.ver.outputs.version }}"
            echo "tag=${{ steps.ver.outputs.tag }}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Release Metadata"
            echo ""
            echo "- App: \`${{ steps.names.outputs.app_display_name }}\`"
            echo "- Channel: \`stable\`"
            echo "- Version: \`${{ steps.ver.outputs.version }}\`"
            echo "- Tag: \`${{ steps.ver.outputs.tag }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Read changelog
        id: notes
        shell: bash
        run: |
          set -euo pipefail

          changelog_file=".github/CHANGELOG.md"
          if [ ! -f "${changelog_file}" ]; then
            echo "::error::Missing changelog file: ${changelog_file}"
            exit 1
          fi

          cp "${changelog_file}" release_notes.md
          echo "========== Release Notes =========="
          cat release_notes.md

          release_notes="$(base64 -w 0 release_notes.md)"
          echo "release_notes=${release_notes}" >> "$GITHUB_OUTPUT"

  build:
    name: Build / ${{ matrix.label }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            runner: windows-2025-vs2026
            platform: win-x64
            rust_target: x86_64-pc-windows-msvc
            os_family: windows
          - label: Windows arm64
            runner: windows-11-vs2026-arm
            platform: win-arm64
            rust_target: aarch64-pc-windows-msvc
            os_family: windows
          - label: Linux x64
            runner: ubuntu-22.04
            platform: linux-x64
            rust_target: x86_64-unknown-linux-gnu
            os_family: linux
          - label: Linux arm64
            runner: ubuntu-22.04-arm
            platform: linux-arm64
            rust_target: aarch64-unknown-linux-gnu
            os_family: linux
          - label: macOS arm64
            runner: macos-26
            platform: macos-arm64
            rust_target: aarch64-apple-darwin
            os_family: macos
          - label: macOS x64
            runner: macos-26-intel
            platform: macos-x64
            rust_target: x86_64-apple-darwin
            os_family: macos

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-rc.1.26425.128

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install Python build dependencies
        run: python -m pip install -r scripts/requirements-build.txt

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ matrix.platform }}-${{ hashFiles('Directory.Build.props', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ matrix.platform }}-
            nuget-${{ runner.os }}-

      - name: Cache Cargo packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-release-${{ runner.os }}-${{ runner.arch }}-${{ matrix.platform }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-release-${{ runner.os }}-${{ runner.arch }}-${{ matrix.platform }}-
            cargo-release-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Linux packaging dependencies
        if: matrix.os_family == 'linux'
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            desktop-file-utils \
            libfontconfig1 \
            libice6 \
            libsm6 \
            libx11-6 \
            rpm \
            unzip \
            zip \
            zstd

          case "${{ matrix.platform }}" in
            linux-x64) appimage_arch="x86_64" ;;
            linux-arm64) appimage_arch="aarch64" ;;
            *) echo "Unsupported AppImage architecture: ${{ matrix.platform }}" >&2; exit 1 ;;
          esac
          mkdir -p "${HOME}/.local/bin"
          curl -L -o "${HOME}/.local/bin/appimagetool" "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${appimage_arch}.AppImage"
          chmod +x "${HOME}/.local/bin/appimagetool"
          echo "${HOME}/.local/bin" >> "$GITHUB_PATH"

      - name: Install Windows packaging dependencies
        if: matrix.os_family == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $installDir = Join-Path $env:RUNNER_TEMP "inno-setup-7"
          $installer = Join-Path $env:RUNNER_TEMP "innosetup-7.exe"
          Invoke-WebRequest `
            -Uri "https://github.com/jrsoftware/issrc/releases/download/is-7_0_1/innosetup-7.0.1-beta-x64.exe" `
            -OutFile $installer
          Start-Process `
            -FilePath $installer `
            -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/DIR=$installDir") `
            -Wait `
            -NoNewWindow

          $iscc = Join-Path $installDir "ISCC.exe"
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup 7 compiler ISCC.exe was not found"
          }
          $installDir >> $env:GITHUB_PATH
          $compilerHelp = & $iscc /? 2>&1 | Out-String
          $global:LASTEXITCODE = 0
          Write-Host $compilerHelp
          if ($compilerHelp -notmatch "Inno Setup 7") {
            throw "Inno Setup compiler is not version 7"
          }

      - name: Build Windows release package
        if: matrix.os_family == 'windows'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/prebuild.py --platform ${{ matrix.platform }}
          python scripts/build.py --platform ${{ matrix.platform }} --version ${{ needs.prepare.outputs.version }} --pack all

      - name: Build Linux release package
        if: matrix.os_family == 'linux'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          python scripts/prebuild.py --platform ${{ matrix.platform }}
          python scripts/build.py --platform ${{ matrix.platform }} --version ${{ needs.prepare.outputs.version }} --pack all

      - name: Build macOS release package
        if: matrix.os_family == 'macos'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_DISPLAY_NAME: ${{ needs.prepare.outputs.app_display_name }}
          APP_VERSION: ${{ needs.prepare.outputs.version }}
          TARGET_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail

          python scripts/prebuild.py --platform ${{ matrix.platform }}
          python scripts/build.py --platform ${{ matrix.platform }} --version ${{ needs.prepare.outputs.version }} --pack all
          # 先归档应用包，保留可执行权限并排除资源分叉、扩展属性与隔离标记。
          ditto -c -k --keepParent --norsrc --noextattr --noqtn \
            "build/packages/${APP_DISPLAY_NAME}.app" \
            "build/packages/ClashMimo-v${APP_VERSION}-${TARGET_PLATFORM}.app.zip"
          unzip -tq "build/packages/ClashMimo-v${APP_VERSION}-${TARGET_PLATFORM}.app.zip"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ClashMimo-release-${{ matrix.platform }}
          path: |
            build/*.zip
            build/packages/*
            !build/*-macos-*.zip
            !build/packages/*.app/**
          if-no-files-found: warn

  release:
    name: Publish to download repository
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    if: ${{ needs.build.result == 'success' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Write release notes
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '${{ needs.prepare.outputs.release_notes }}' | base64 --decode > release_notes.md
          cat release_notes.md

      - name: Clean up existing release and tag (if re-running)
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "${{ needs.prepare.outputs.tag }}" --json id --jq '.id' &>/dev/null; then
            echo "Existing release found for ${{ needs.prepare.outputs.tag }}. Deleting..."
            gh release delete "${{ needs.prepare.outputs.tag }}" --yes --cleanup-tag
            echo "Deleted old release and tag."
          else
            echo "No existing release found for ${{ needs.prepare.outputs.tag }}."
          fi

      - name: Publish to ClashMimo
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: assassin321/ClashMimo
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.prepare.outputs.app_display_name }} ${{ needs.prepare.outputs.version }}
          body_path: release_notes.md
          files: |
            artifacts/**/*.zip
            artifacts/**/*.exe
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.pkg.tar.zst
            artifacts/**/*.AppImage
            artifacts/**/*.dmg
            artifacts/**/*.pkg
          draft: false
          prerelease: false
          overwrite_files: true
          make_latest: true

      - name: Find promoted beta source
        id: promotion
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/pulls?state=closed&base=stable&sort=updated&direction=desc&per_page=100" \
            > stable-pulls.json
          pull_number=''
          source_sha=''
          while IFS=$'\t' read -r candidate_number merge_sha candidate_source_sha; do
            if git merge-base --is-ancestor "${merge_sha}" "${GITHUB_SHA}"; then
              pull_number="${candidate_number}"
              source_sha="${candidate_source_sha}"
              break
            fi
          done < <(
            jq -r --arg repository "${GITHUB_REPOSITORY}" '
              [
                .[][]
                | select(
                    .merged_at != null
                    and .base.ref == "stable"
                    and .head.ref == "beta"
                    and .head.repo.full_name == $repository
                    and .merge_commit_sha != null
                    and .head.sha != null
                  )
              ]
              | sort_by(.merged_at)
              | reverse
              | .[]
              | [.number, .merge_commit_sha, .head.sha]
              | @tsv
            ' stable-pulls.json
          )
          if [ -z "${source_sha}" ]; then
            echo '::warning::No merged beta to stable pull request found. Skipping beta baseline creation.'
            echo 'skip_baseline=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf 'pull_number=%s\nsource_sha=%s\nskip_baseline=false\n' "${pull_number}" "${source_sha}" | tee -a "$GITHUB_OUTPUT"

      - name: Create beta release baseline
        if: steps.promotion.outputs.skip_baseline != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ steps.promotion.outputs.source_sha }}
        run: |
          set -euo pipefail
          baseline_tag="beta-base/${{ needs.prepare.outputs.tag }}"
          existing_sha="$(
            git ls-remote --tags origin "refs/tags/${baseline_tag}" "refs/tags/${baseline_tag}^{}" |
              awk '$2 ~ /\^\{\}$/ { peeled=$1 } $2 !~ /\^\{\}$/ { direct=$1 } END { print peeled ? peeled : direct }'
          )"
          if [ -n "${existing_sha}" ]; then
            if [ "${existing_sha}" != "${SOURCE_SHA}" ]; then
              echo "::error::${baseline_tag} already points to ${existing_sha}, expected ${SOURCE_SHA}."
              exit 1
            fi
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${baseline_tag}" \
              -f sha="${SOURCE_SHA}" >/dev/null
          fi
          echo "Beta baseline ${baseline_tag} points to ${SOURCE_SHA}."
          echo "- Beta baseline: \`${baseline_tag}\`" >> "$GITHUB_STEP_SUMMARY"